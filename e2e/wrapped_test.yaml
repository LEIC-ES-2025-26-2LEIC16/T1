appId: com.myimpact.app
---
- launchApp:
    clearState: true

# login
- extendedWaitUntil:
    visible: "Entra na tua conta"
    timeout: 15000
- tapOn: "Email"
- inputText: "up202406974@up.pt"
- tapOn: "Password"
- inputText: "123456"
- hideKeyboard
- tapOn: "Entrar"

# wait for home screen to load
- extendedWaitUntil:
    visible: "Home"
    timeout: 15000

# navigate to profile via avatar button
- tapOn:
    id: "profile-avatar-button"

- waitForAnimationToEnd

# scroll down to wrapped button and tap it
- scrollUntilVisible:
    element:
      id: "profile-wrapped-button"
    direction: DOWN

- tapOn:
    id: "profile-wrapped-button"

- waitForAnimationToEnd

# verify wrapped empty state is shown (no recycling data for new user)
- extendedWaitUntil:
    visible: "Ainda sem dados"
    timeout: 15000

- assertVisible:
    id: "wrapped-empty-state"
