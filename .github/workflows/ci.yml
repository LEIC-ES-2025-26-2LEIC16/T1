name: MyImpact CI/CD

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ] # Dispara quando for criada uma tag, ex: v1.0.0
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Permite correr o workflow (ou apenas o build) manualmente no GitHub

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./eco-app

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./eco-app/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm run test

  build-android:
    name: Build Android APK
    needs: test
    # Apenas corre se for um trigger manual (workflow_dispatch) OU se for uma nova tag de versão/release
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./eco-app

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./eco-app/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Prebuild Expo (Generate Android folder)
        run: npx expo prebuild --platform android --clean

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: myimpact-release-apk
          path: eco-app/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
