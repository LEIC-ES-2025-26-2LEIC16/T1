appId: com.myimpact.app
---
- launchApp:
    clearState: false

- extendedWaitUntil:
    visible: "Entra na tua conta|Ver todos os ecopontos"
    timeout: 30000

- runFlow:
    when:
      visible: "Ver todos os ecopontos"
    commands:
      - tapOn:
          id: "profile-avatar-button"
      - scrollUntilVisible:
          element: "Terminar sessão"
          direction: DOWN
      - tapOn: "Terminar sessão"
      - tapOn: "Sair"
      - waitForAnimationToEnd

- assertVisible: "Entra na tua conta"

- tapOn:
    id: "autofill-login"

- tapOn: "Entrar"

- waitForAnimationToEnd
- assertVisible: "Ver todos os ecopontos"