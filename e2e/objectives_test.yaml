appId: com.myimpact.app
---
- launchApp:
    clearState: false

- extendedWaitUntil:
    visible: "Entra na tua conta|Ver todos os ecopontos"
    timeout: 30000

- runFlow:
    when:
      visible: "Entra na tua conta"
    commands:
      - tapOn:
          id: "autofill-login"
      - tapOn: "Entrar"
      - extendedWaitUntil:
          visible: "Ver todos os ecopontos"
          timeout: 20000

- tapOn: "Objetivos"

- waitForAnimationToEnd

- tapOn:
    id: "objectives-add-button"

- tapOn:
    id: "chip-material-Plástico"

- tapOn:
    id: "autofill-obj-10"

- tapOn:
    id: "chip-periodo-mensal"

- tapOn:
    id: "objectives-create-button"

- waitForAnimationToEnd

- tapOn:
    id: "objectives-add-button"

- tapOn:
    id: "chip-material-Vidro"

- tapOn:
    id: "autofill-obj-20"

- tapOn:
    id: "chip-periodo-semanal"

- tapOn:
    id: "objectives-create-button"

- waitForAnimationToEnd

- assertVisible: ".*Vidro.*"
- assertVisible: ".*Plástico.*"
