appId: com.myimpact.app
---
- launchApp:
    clearState: false
    stopApp: false

- extendedWaitUntil:
    visible: "Ver todos os ecopontos"
    timeout: 30000

- tapOn:
    id: "profile-avatar-button"

- waitForAnimationToEnd

- tapOn:
    id: "profile-edit-button"

- tapOn:
    id: "profile-name-input"
- repeat:
    times: 40
    commands:
      - pressKey: Backspace
- inputText: "Joao"

- tapOn:
    id: "profile-username-input"
- repeat:
    times: 40
    commands:
      - pressKey: Backspace
- inputText: "jo"

- tapOn:
    id: "profile-bio-input"
- repeat:
    times: 80
    commands:
      - pressKey: Backspace
- inputText: "test"

- waitForAnimationToEnd

- tapOn:
    id: "profile-save-button"

- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "Editar perfil"
    timeout: 10000

- assertVisible: "Joao"