appId: com.myimpact.app
---
- launchApp:
    clearState: true
  
- tapOn: "Esqueceu-se da password?"
- assertVisible: "Recuperar acesso"

- tapOn: "Email"
- inputText: "teste@exemplo.com" # usar um email de exemplo

- tapOn: "Enviar"

# validar a mensagem genérica de sucesso
- extendedWaitUntil:
    visible: ".*Se o endereço estiver registado.*"
    timeout: 10000

# clicar em "Criar conta" e validar que o ecrã de registo abriu
- tapOn: "Criar conta"
- assertVisible: "Bem-vindo ao My Impact"