appId: com.myimpact.app
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "Entra na tua conta"
    timeout: 30000

- tapOn:
    id: "autofill-login"

- tapOn: "Entrar"

- extendedWaitUntil:
    visible: "O TEU IMPACTO ESTE MÊS"
    timeout: 30000

- tapOn:
    id: "profile-avatar-button"

- waitForAnimationToEnd

- scrollUntilVisible:
    element: "Procurar"
    direction: DOWN

- assertVisible: "AMIGOS"

- tapOn: "Procurar"

- assertVisible: "Pesquisar por nome ou username..."

- tapOn: "Pedidos.*"

- assertVisible: "Pedidos.*"
