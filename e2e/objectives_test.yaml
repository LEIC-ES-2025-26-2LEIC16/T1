appId: com.myimpact.app
---
- launchApp:
    clearState: true

# login
- extendedWaitUntil:
    visible: "Entra na tua conta"
    timeout: 15000
- tapOn: "Email"
- inputText: "up202406974@up.pt"
- tapOn: "Password"
- inputText: "123456"
- hideKeyboard
- tapOn: "Entrar"

# wait for home screen to load
- extendedWaitUntil:
    visible: "Home"
    timeout: 15000

# navigate to objectives tab
- tapOn: "Objetivos"

- waitForAnimationToEnd

# verify empty state
- extendedWaitUntil:
    visible: "Sem objetivos ainda"
    timeout: 10000

- assertVisible:
    id: "objectives-empty-state"

# open create form
- tapOn:
    id: "objectives-add-button"

# select material "Plástico"
- tapOn:
    id: "chip-material-Plástico"

# enter goal weight
- tapOn: "Ex: 10"
- inputText: "10"

# select period "Mensal"
- tapOn:
    id: "chip-periodo-mensal"

# hide keyboard
- hideKeyboard

# create objective
- tapOn:
    id: "objectives-create-button"

- waitForAnimationToEnd

# verify objective card appears with correct material
- assertVisible: "10%"

# create a second objective
- tapOn:
    id: "objectives-add-button"

- tapOn:
    id: "chip-material-Vidro"

- tapOn: "Ex: 10"
- inputText: "20"

- tapOn:
    id: "chip-periodo-semanal"

- hideKeyboard

- tapOn:
    id: "objectives-create-button"

- waitForAnimationToEnd

# verify both objectives exist
- assertVisible: ".*Vidro.*"
- assertVisible: ".*Plástico.*"
