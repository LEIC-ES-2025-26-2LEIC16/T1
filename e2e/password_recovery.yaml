appId: com.myimpact.app
---
- launchApp:
    clearState: false

- extendedWaitUntil:
    visible: "Entra na tua conta|Ver todos os ecopontos"
    timeout: 30000

- runFlow:
    when:
      visible: "Ver todos os ecopontos"
    commands:
      - tapOn:
          id: "profile-avatar-button"
      - scrollUntilVisible:
          element: ".*Terminar sess.o.*"
          direction: DOWN
      - tapOn: ".*Terminar sess.o.*"
      - tapOn: "SAIR"
      - extendedWaitUntil:
          visible: "Entra na tua conta"
          timeout: 15000
  
- tapOn: "Esqueceu-se da password?"
- assertVisible: "Recuperar acesso"

- tapOn:
    id: "autofill-recovery"

- tapOn: "Enviar"

# validar a mensagem genérica de sucesso
- extendedWaitUntil:
    visible: ".*Se o endereço estiver registado.*"
    timeout: 10000

# clicar em "Criar conta" e validar que o ecrã de registo abriu
- tapOn: "Criar conta"
- assertVisible: "Bem-vindo ao My Impact"