name: React Native CI

# this tells github exactly when to run our automated tasks
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    # we need a virtual machine to run our stuff, ubuntu is the standard go-to
    runs-on: ubuntu-latest

    steps:
    # first, we grab our code from the repo so the runner can see it
    - name: Checkout repository
      uses: actions/checkout@v4

    # since the actual app code is still in another branch awaiting review,
    # let's just make sure the CI pipeline is wired up correctly for now
    - name: Sprint 0 Sanity Check
      run: echo "GitHub Actions is alive and well! Ready for the app merge."