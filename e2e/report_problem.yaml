appId: com.myimpact.app
---
- launchApp:
    clearState: false

- extendedWaitUntil:
    visible: "Entra na tua conta|Ver todos os ecopontos"
    timeout: 30000

- runFlow:
    when:
      visible: "Entra na tua conta"
    commands:
      - tapOn:
          id: "autofill-login"
      - tapOn: "Entrar"
      - extendedWaitUntil:
          visible: "Ver todos os ecopontos"
          timeout: 20000

- tapOn: "Ver todos os ecopontos"

- extendedWaitUntil:
    visible: "Ecopontos"
    timeout: 10000

- tapOn:
    id: "recycling-bin-marker"
    index: 0

- extendedWaitUntil:
    visible: "O QUE QUERES FAZER\\?"
    timeout: 10000

- tapOn:
    id: "report-problem-button"

- tapOn:
    id: "autofill-report"
- tapOn: "Enviar Reporte"

#o Maestro apenas precisa de esperar que o clique não dê erro.