appId: com.myimpact.app
---
- launchApp:
    clearState: false

- extendedWaitUntil:
    visible: "Entra na tua conta|Ver todos os ecopontos"
    timeout: 30000

- runFlow:
    when:
      visible: "Entra na tua conta"
    commands:
      - tapOn:
          id: "autofill-login"
      - tapOn: "Entrar"
      - extendedWaitUntil:
          visible: "Ver todos os ecopontos"
          timeout: 20000

- tapOn: "Ver todos os ecopontos"

- assertVisible: "Ecopontos"

- tapOn: "\\+ Adicionar"

- tapOn:
    id: "autofill-ecoponto"

- tapOn: "Operacional"

- tapOn: "Guardar Ecoponto"

- assertVisible: "Sucesso"
- tapOn: "OK"