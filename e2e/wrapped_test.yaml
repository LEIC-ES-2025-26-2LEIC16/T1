appId: com.myimpact.app
---
- launchApp:
    clearState: false

- extendedWaitUntil:
    visible: "Entra na tua conta|Ver todos os ecopontos"
    timeout: 30000

- runFlow:
    when:
      visible: "Entra na tua conta"
    commands:
      - tapOn:
          id: "autofill-login"
      - tapOn: "Entrar"
      - extendedWaitUntil:
          visible: "Ver todos os ecopontos"
          timeout: 20000

- tapOn:
    id: "profile-avatar-button"

- waitForAnimationToEnd

- scrollUntilVisible:
    element:
      id: "profile-wrapped-button"
    direction: DOWN

- tapOn:
    id: "profile-wrapped-button"

- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "Ainda sem dados|WRAPPED 2026"
    timeout: 15000
