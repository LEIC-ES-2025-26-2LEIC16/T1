appId: com.myimpact.app
---
- launchApp:
    clearState: false

- extendedWaitUntil:
    visible: "Ver todos os ecopontos"
    timeout: 30000

- tapOn:
    id: "profile-avatar-button"

- waitForAnimationToEnd

- tapOn:
    id: "profile-edit-button"

# Injetamos o texto diretamente no ID sem chamadas intermédias de apagar
- inputText:
    id: "profile-name-input"
    text: "Joao Silva"

- inputText:
    id: "profile-username-input"
    text: "joaosilva2026"

- inputText:
    id: "profile-bio-input"
    text: "Bio de teste"

- hideKeyboard

- tapOn:
    id: "profile-cancel-button"

- waitForAnimationToEnd

- tapOn:
    id: "profile-edit-button"

- inputText:
    id: "profile-name-input"
    text: "Maria Updated"

- hideKeyboard

- tapOn:
    id: "profile-save-button"

- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "Maria Updated"
    timeout: 10000