appId: com.myimpact.app
---
- launchApp:
    clearState: false
    stopApp: false

- extendedWaitUntil:
    visible: "Entra na tua conta|Ver todos os ecopontos"
    timeout: 30000

- runFlow:
    when:
      visible: "Entra na tua conta"
    commands:
      - tapOn:
          id: "autofill-login"
      - tapOn: "Entrar"
      - extendedWaitUntil:
          visible: "Ver todos os ecopontos"
          timeout: 20000

- tapOn:
    id: "profile-avatar-button"

- waitForAnimationToEnd

- tapOn:
    id: "profile-edit-button"

- tapOn:
    id: "autofill-profile"

- waitForAnimationToEnd

- tapOn:
    id: "profile-save-button"

- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "Editar perfil"
    timeout: 10000

- assertVisible: "Joao"