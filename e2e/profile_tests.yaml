appId: com.myimpact.app
---
- launchApp:
    clearState: true

# login
- extendedWaitUntil:
    visible: "Entra na tua conta"
    timeout: 15000
- tapOn: "Email"
- inputText: "up202406974@up.pt"
- tapOn: "Password"
- inputText: "123456"
- hideKeyboard
- tapOn: "Entrar"

# wait for home screen to load
- extendedWaitUntil:
    visible: "Home"
    timeout: 15000

# navigate to profile via avatar button
- tapOn:
    id: "profile-avatar-button"

- waitForAnimationToEnd

# tap "Editar perfil" button
- tapOn:
    id: "profile-edit-button"

# edit name field
- tapOn: "O teu nome"
- eraseText
- inputText: "Joao Silva"

# edit username field
- tapOn: "@username"
- eraseText
- inputText: "joaosilva2026"

# edit bio field
- tapOn: "Conta um pouco sobre ti"
- eraseText
- inputText: "Test bio"

# cancel editing
- tapOn:
    id: "profile-cancel-button"

- waitForAnimationToEnd

# verify original name still visible
- assertVisible: "Joao Silva"

# tap edit again to confirm save flow
- tapOn:
    id: "profile-edit-button"

- tapOn: "O teu nome"
- eraseText
- inputText: "Maria Updated"

- tapOn:
    id: "profile-save-button"

- waitForAnimationToEnd

# verify updated name is displayed
- extendedWaitUntil:
    visible: "Maria Updated"
    timeout: 10000
