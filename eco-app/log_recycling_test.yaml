appId: com.ecoapp.dev 
---
- launchApp

# 1. Selecionar o Material (Plástico)
- tapOn: "Plástico"

# 2. Inserir o peso (NOVIDADE)
- tapOn: "Ex: 2.5"
- inputText: "2"
- hideKeyboard

# 3. Tirar Foto
- tapOn: "Abrir Câmara"
# Nota: O Maestro em modo dev não tira fotos reais, mas clica no botão.

# 4. Submeter
- tapOn: "Submeter (+10 pts)"

# 5. Validar a mensagem dinâmica (Plástico * 1.5 = 3.00kg CO2)
- assertVisible:
    text: "Reciclagem registada! Ganhaste +10 pts e poupaste 3.00kg de CO2."