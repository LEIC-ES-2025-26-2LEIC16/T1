appId: com.myimpact.app
---
- launchApp:
    clearState: false

# a nossa app vai abrir já com o login feito, logo procuramos o mapa
- extendedWaitUntil:
    visible: "Ecopontos"
    timeout: 10000

# fluxo de reciclagem
- tapOn: "Registar Reciclagem"
- tapOn: "Ex: 2.5"
- inputText: "2"
- tapOn: "Plástico"
- hideKeyboard
- tapOn: "Abrir Câmara"
- tapOn: "Submeter (+10 pts)"